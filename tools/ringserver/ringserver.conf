# ringserver configuration for the GaiaSeis SeedLink service.
# Installed by tools/ringserver/install.sh to ~/.config/gaiaseis/ringserver.conf
# (edit that copy; this one is the template shipped with GaiaSeis).
#
# GaiaSeis pushes every miniSEED record over DataLink (port 16000, localhost
# only); SeisComP / ObsPy / slinktool read SeedLink on port 18000.
# Ring = 1 GiB on disk ≈ 2.5 days of three 10 Hz INT32 channels; raise
# RingSize for longer replay. The ring survives ringserver restarts.

RingDirectory __HOME__/.local/share/gaiaseis/ring
RingSize 1G
MaxPacketSize 512
ServerID "GaiaSeis UPA10Z"

# DataLink (writers) — loopback only; GaiaSeis runs on this machine.
ListenPort 16000 DataLink IPv4
# SeedLink (readers) — reachable from the LAN / port-forward.
ListenPort 18000 SeedLink IPv4
# WriteIP: localhost is granted write permission by default. To let a
# GaiaSeis on another host push, add its address:
#WriteIP 192.0.2.10

ClientTimeout 3600
MaxClientsPerIP 20
ResolveHostnames 0
Verbosity 1
UsageLogDirectory __HOME__/.local/share/gaiaseis/ringserver-logs
UsageLogInterval 24

# Access restriction (2026-10-23): only these addresses may connect to any
# listening port (DataLink 16000 and SeedLink 18000). Loopback is needed for
# the GaiaSeis DataLink push and local checks; the /24s are the department
# networks. Dynamic parameter: ringserver re-reads the file when it changes.
AcceptIP 127.0.0.1
# Networks allowed to read SeedLink: put your own here (example ranges).
AcceptIP 192.0.2.0/24
AcceptIP 198.51.100.0/24

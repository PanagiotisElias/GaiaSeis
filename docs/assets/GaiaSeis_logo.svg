<?xml version="1.0" encoding="UTF-8"?>
<!--
  GaiaSeis logo — GNSS-based real-time seismogeodesy.
  Deforming Gaia Lab, Department of Geology, University of Patras.
  Author: Panagiotis Elias <pelias@upatras.gr>
  Licence: CC BY-NC 4.0 (same as the software).

  Notes on the geometry:
  - Outer badge: concentric circles at (256, 240), r=220 (rim) / r=208 (inner).
  - Satellite at (368, 102): its angle from the badge centre is ~52° above
    horizontal in SVG-up terms. The tangent to the badge circle at that point
    runs perpendicular to that radius, i.e. inclined ~-38° from the SVG
    horizontal axis — so we rotate the satellite group by -38° so the solar
    panels lie parallel to the rim arc.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" width="512" height="700">
  <defs>
    <!-- Deep-sky gradient for the inner badge -->
    <radialGradient id="skyFill" cx="50%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#1c5db5"/>
      <stop offset="65%"  stop-color="#0d2a55"/>
      <stop offset="100%" stop-color="#04122e"/>
    </radialGradient>
    <!-- Warm orange → red gradient for the seismic pulse -->
    <linearGradient id="pulseStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f6c244"/>
      <stop offset="55%"  stop-color="#e9621d"/>
      <stop offset="100%" stop-color="#b71d0f"/>
    </linearGradient>
    <!-- Ground line gradient (earth-tones) — replaces the previous
         blue sea-arc to signal that the antenna sits on solid ground
         monitoring crustal deformation. -->
    <linearGradient id="earthArc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#b88a5a"/>
      <stop offset="100%" stop-color="#6e5235"/>
    </linearGradient>
    <!-- Subsurface gradient (darker brown for the rock body underground) -->
    <linearGradient id="subsurfFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3a2c1a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0.65"/>
    </linearGradient>
    <!-- Clip path constraining subsurface elements to the inner badge -->
    <clipPath id="badgeClipLogo">
      <circle cx="256" cy="240" r="208"/>
    </clipPath>
    <!-- Beam gradient — bright at the satellite end, fading toward the
         antenna so the wave path reads as energy travelling downwards. -->
    <linearGradient id="beamFade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff6c4" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#f6c244" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e9621d" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beamFade2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f6c244" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f6c244" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Cyan/teal beam for the second (Galileo-style) satellite -->
    <linearGradient id="beamFadeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#bff0ff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#5bc1e6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1b7aa3" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beamFadeCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5bc1e6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5bc1e6" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Subtle glow for the beams -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <!-- Radome highlight -->
    <radialGradient id="radomeHL" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#dde2eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9ea7b8" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- ICON  (transparent background — no <rect/> behind anything)   -->
  <!-- ============================================================ -->
  <g transform="translate(0,0)">

    <!-- Outer ring + inner badge -->
    <circle cx="256" cy="240" r="220" fill="#cfd5dd"/>
    <circle cx="256" cy="240" r="208" fill="url(#skyFill)"/>

    <!-- =================== Celestial constellation (Cassiopeia) ===================
         A discrete W-shape asterism in the sky between the two satellites,
         hinting at the celestial reference frame against which GNSS orbits
         are defined. Drawn faint enough not to compete with the foreground
         (satellites, beams, waveform) — it's a quiet background element.
         Greek-mythology choice: Cassiopeia was a queen of Aethiopia in
         Hellenic legend, fitting for a Patras lab. -->
    <g id="cassiopeia">
      <polyline points="200,145 228,100 256,142 284,100 312,145"
                fill="none" stroke="#bcd0ea" stroke-width="0.7"
                stroke-opacity="0.32" stroke-linecap="round"
                stroke-linejoin="round"/>
      <g fill="#f5faff">
        <circle cx="200" cy="145" r="1.9" opacity="0.80"/>
        <circle cx="228" cy="100" r="2.3" opacity="0.92"/>
        <circle cx="256" cy="142" r="1.7" opacity="0.78"/>
        <circle cx="284" cy="100" r="2.5" opacity="0.95"/>
        <circle cx="312" cy="145" r="2.0" opacity="0.82"/>
      </g>
      <g fill="#cfd9eb">
        <circle cx="185" cy="115" r="0.7" opacity="0.55"/>
        <circle cx="218" cy="155" r="0.6" opacity="0.5"/>
        <circle cx="245" cy="80"  r="0.8" opacity="0.6"/>
        <circle cx="268" cy="165" r="0.6" opacity="0.5"/>
        <circle cx="293" cy="148" r="0.7" opacity="0.55"/>
        <circle cx="324" cy="125" r="0.6" opacity="0.5"/>
        <circle cx="206" cy="170" r="0.5" opacity="0.4"/>
        <circle cx="275" cy="120" r="0.5" opacity="0.45"/>
      </g>
    </g>

    <!-- =================== Ground surface + rupture trace ===================
         Brown ground line (gentle arc following the badge curve) with a
         soft wavy terrain on top for relief. Below the ground we draw a
         single, irregular rupture trace — only smooth Bezier curves, no
         straight segments anywhere — meant to read as a stylised
         surface-fault rupture rather than a textbook schematic. -->

    <!-- Subsurface darker fill below the ground line (gives depth) -->
    <g clip-path="url(#badgeClipLogo)">
      <rect x="40" y="380" width="432" height="80" fill="url(#subsurfFill)"/>
    </g>

    <!-- Surface marker: only the wavy terrain undulations remain
         (the two split ground arcs were removed). The terrain itself
         carries the subsidence visual — its right half sits 6 px lower
         than the left, with the scarp at the rupture point. -->
    <path d="M 110 378 Q 145 370, 175 376
             Q 205 382, 235 374 Q 260 368, 275 376"
          fill="none" stroke="#cfa478" stroke-width="3"
          stroke-linecap="round" opacity="0.65"/>
    <path d="M 290 384 Q 320 390, 355 380 Q 390 374, 420 384"
          fill="none" stroke="#cfa478" stroke-width="3"
          stroke-linecap="round" opacity="0.65"/>

    <!-- Rupture trace — surfaces at the scarp (connects the footwall
         and hangingwall ground levels with a tight curve) then winds
         down into the subsurface in irregular Bezier segments. -->
    <g clip-path="url(#badgeClipLogo)">
      <path d="M 282 380
               Q 280 383, 282 386
               C 268 396, 300 406, 280 418
               C 258 428, 302 434, 282 448
               C 268 460, 300 462, 285 472"
            fill="none" stroke="#c0392b" stroke-width="2.6"
            stroke-linecap="round" opacity="0.92"/>
    </g>

    <!-- =================== GNSS satellite =================== -->
    <!-- Rotated 52° about its own centre (= -38° tangent angle + 90°) so
         the solar-panel axis is now RADIAL relative to the inner badge
         — i.e. one panel points toward Earth, the other away from it. -->
    <g transform="translate(368,102) rotate(52)">
      <!-- bus -->
      <rect x="-13" y="-10" width="26" height="20" rx="2.5"
            fill="#e5e9f0" stroke="#0a2147" stroke-width="2"/>
      <!-- solar panels -->
      <rect x="-46" y="-6.5" width="30" height="13" rx="1.5"
            fill="#3b6dbf" stroke="#0a2147" stroke-width="1.6"/>
      <rect x="16"  y="-6.5" width="30" height="13" rx="1.5"
            fill="#3b6dbf" stroke="#0a2147" stroke-width="1.6"/>
      <!-- panel grid lines (subtle) -->
      <g stroke="#0a2147" stroke-width="0.8" opacity="0.55">
        <line x1="-38" y1="-6.5" x2="-38" y2="6.5"/>
        <line x1="-30" y1="-6.5" x2="-30" y2="6.5"/>
        <line x1="-22" y1="-6.5" x2="-22" y2="6.5"/>
        <line x1="22"  y1="-6.5" x2="22"  y2="6.5"/>
        <line x1="30"  y1="-6.5" x2="30"  y2="6.5"/>
        <line x1="38"  y1="-6.5" x2="38"  y2="6.5"/>
      </g>
      <!-- antenna nub on the Earth-facing side (downwards after rotation) -->
      <line x1="0" y1="10" x2="0" y2="16" stroke="#0a2147" stroke-width="1.8"/>
      <circle cx="0" cy="18" r="3" fill="#e5e9f0" stroke="#0a2147" stroke-width="1.2"/>
    </g>

    <!-- =================== Beams =================== -->
    <!-- Three curved beams running from the satellite (~378, 122 after the
         rotation) down to the antenna at (200, 360). One thick main beam
         with a glow, plus two slimmer fading beams above and below to give
         a "signal cone" feel. -->
    <g filter="url(#softGlow)">
      <path d="M 360 130 C 320 200, 270 280, 215 350"
            fill="none" stroke="url(#beamFade)"
            stroke-width="6" stroke-linecap="round"/>
    </g>
    <path d="M 360 130 C 320 200, 270 280, 215 350"
          fill="none" stroke="url(#beamFade)"
          stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 348 116 C 308 188, 258 268, 200 348"
          fill="none" stroke="url(#beamFade2)"
          stroke-width="2.0" stroke-linecap="round"/>
    <path d="M 372 142 C 336 212, 285 290, 230 358"
          fill="none" stroke="url(#beamFade2)"
          stroke-width="1.6" stroke-linecap="round"/>

    <!-- Three small "data packet" dots travelling down the main beam,
         spaced unequally so it looks like an actual transmission. -->
    <g fill="#fff6c4">
      <circle cx="328" cy="200" r="2.4"/>
      <circle cx="285" cy="260" r="2.0" opacity="0.85"/>
      <circle cx="248" cy="310" r="1.7" opacity="0.7"/>
    </g>

    <!-- =================== Second satellite (Galileo-style) =================== -->
    <!-- Upper-left of the badge, deliberately distinct from the first
         satellite so the icon reads as "multiple GNSS constellations":
           * hexagonal bus instead of rounded-rectangular
           * gold / copper colour scheme instead of blue
           * square-aspect solar panels instead of long rectangles
           * a small parabolic dish on the Earth-facing side
         Rotated -52° (mirror of the first sat's +52°) so its panel axis
         points radially inward, "looking down" toward the antenna. -->
    <g transform="translate(144,102) rotate(-52)">
      <!-- hexagonal bus -->
      <path d="M -14 0 L -8 -11 L 8 -11 L 14 0 L 8 11 L -8 11 Z"
            fill="#94a3b8" stroke="#04122e" stroke-width="2"/>
      <!-- yoke arms holding the panels -->
      <line x1="-14" y1="0" x2="-20" y2="0" stroke="#04122e" stroke-width="2"/>
      <line x1="14"  y1="0" x2="20"  y2="0" stroke="#04122e" stroke-width="2"/>
      <!-- two square solar panels -->
      <rect x="-38" y="-13" width="18" height="26" rx="1.5"
            fill="#c89a3d" stroke="#04122e" stroke-width="1.6"/>
      <rect x="20"  y="-13" width="18" height="26" rx="1.5"
            fill="#c89a3d" stroke="#04122e" stroke-width="1.6"/>
      <!-- panel grid (cross pattern) -->
      <g stroke="#04122e" stroke-width="0.8" opacity="0.55">
        <line x1="-29" y1="-13" x2="-29" y2="13"/>
        <line x1="-38" y1="0"   x2="-20" y2="0"/>
        <line x1="29"  y1="-13" x2="29"  y2="13"/>
        <line x1="20"  y1="0"   x2="38"  y2="0"/>
      </g>
      <!-- parabolic dish on the Earth-facing side (downwards after rot) -->
      <path d="M -8 11 Q 0 22, 8 11" fill="#e5e9f0" stroke="#04122e" stroke-width="1.3"/>
      <line x1="0" y1="11" x2="0" y2="20" stroke="#04122e" stroke-width="1.6"/>
      <circle cx="0" cy="21" r="2.2" fill="#e9621d" stroke="#04122e" stroke-width="1"/>
    </g>

    <!-- Beams from the second satellite to the antenna, in cyan tones -->
    <g filter="url(#softGlow)">
      <path d="M 156 130 C 175 200, 188 280, 200 350"
            fill="none" stroke="url(#beamFadeCyan)"
            stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M 156 130 C 175 200, 188 280, 200 350"
          fill="none" stroke="url(#beamFadeCyan)"
          stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 138 116 C 158 192, 174 274, 188 354"
          fill="none" stroke="url(#beamFadeCyan2)"
          stroke-width="1.8" stroke-linecap="round"/>
    <g fill="#dff5ff">
      <circle cx="172" cy="200" r="2.0" opacity="0.9"/>
      <circle cx="186" cy="270" r="1.7" opacity="0.7"/>
    </g>

    <!-- =================== GNSS antenna (radome only) =================== -->
    <!-- Geodetic-grade radome scaled to occupy the same footprint as the
         original full antenna assembly (~56 wide × 36 tall). Drawn in
         elevation: a single hemispherical dome on a small support stub. -->
    <g transform="translate(200,360)">
      <!-- support stub -->
      <rect x="-6" y="0" width="12" height="16" fill="#5a6275" stroke="#04122e" stroke-width="1"/>
      <!-- mount base / antenna ground plane (thin ellipse the dome sits on) -->
      <ellipse cx="0" cy="0" rx="30" ry="4" fill="#7a8395" stroke="#04122e" stroke-width="1.2"/>
      <!-- radome (large hemispherical dome) -->
      <path d="M -28 0 A 28 32 0 0 1 28 0 Z"
            fill="#e5e9f0" stroke="#04122e" stroke-width="1.5"/>
      <!-- radome highlight (specular sheen, top-left) -->
      <path d="M -28 0 A 28 32 0 0 1 28 0 Z" fill="url(#radomeHL)"/>
      <!-- tiny element / status indicator at the apex -->
      <circle cx="0" cy="-32" r="2" fill="#e9621d" stroke="#04122e" stroke-width="0.9"/>
    </g>

    <!-- =================== Seismic / displacement waveform =================== -->
    <path d="M 80 260
             L 110 260
             Q 120 258, 130 263
             Q 140 268, 150 261
             Q 160 254, 168 262
             Q 176 270, 184 258
             Q 192 240, 202 280
             Q 210 200, 222 320
             Q 235 160, 248 290
             Q 258 245, 268 262
             Q 278 270, 290 259
             Q 300 250, 312 262
             Q 322 270, 334 261
             Q 348 252, 360 263
             L 432 263"
          fill="none" stroke="url(#pulseStroke)" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Time-axis tick marks under the waveform -->
    <g stroke="#cfd5dd" stroke-width="1.5" opacity="0.7">
      <line x1="120" y1="305" x2="120" y2="312"/>
      <line x1="200" y1="305" x2="200" y2="312"/>
      <line x1="280" y1="305" x2="280" y2="312"/>
      <line x1="360" y1="305" x2="360" y2="312"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- WORDMARK + LEGEND (three lines)                                -->
  <!-- ============================================================ -->
  <g transform="translate(256,510)" text-anchor="middle">
    <text font-family="Cambria, 'Times New Roman', serif"
          font-size="64" font-weight="700"
          fill="#0a2147" letter-spacing="-1">
      <tspan>Gaia</tspan><tspan fill="#b71d0f">Seis</tspan>
    </text>
    <text y="42"
          font-family="Cambria, 'Times New Roman', serif"
          font-size="20" font-style="italic"
          fill="#4a5566" letter-spacing="0.4">
      GNSS · Real-time Seismogeodesy
    </text>
    <text y="74"
          font-family="Cambria, 'Times New Roman', serif"
          font-size="16" font-style="italic"
          fill="#4a5566" letter-spacing="0.3">
      University of Patras · Deforming Gaia Lab
    </text>
  </g>
</svg>

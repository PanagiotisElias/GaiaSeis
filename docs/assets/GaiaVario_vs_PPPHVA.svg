<rect x="420" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text x="530" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Saastamoinen + Niell</text><text x="530" y="36" text-anchor="middle" font-size="12" fill="#0F6E56">no data files needed</text>
</g>
<g transform="translate(0,404)">
<rect x="40" width="120" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="100" y="29" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Tide, antenna</text>
<rect x="180" width="220" height="48" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="290" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Tide, wind-up, PCO/PCV</text><text x="290" y="36" text-anchor="middle" font-size="12" fill="#993C1D">ANTEX file per antenna</text>
<rect x="420" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text x="530" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Tide, wind-up; no PCO</text><text x="530" y="36" text-anchor="middle" font-size="12" fill="#0F6E56">PCO changes by µm per epoch</text>
</g>
<g transform="translate(0,466)">

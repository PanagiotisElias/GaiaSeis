<rect x="180" width="220" height="48" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="290" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">LS, 2.5σ residual gate</text><text x="290" y="36" text-anchor="middle" font-size="12" fill="#993C1D">satellite flags in bridge</text>
<rect x="420" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text x="530" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">LS, 4σ MAD rejection</text><text x="530" y="36" text-anchor="middle" font-size="12" fill="#0F6E56">reason per satellite</text>
</g>
<g transform="translate(0,528)">
<rect x="40" width="120" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="100" y="29" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Noise σ</text>
<rect x="180" width="220" height="48" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="290" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">σ̂ EMA 300 up / 30 down</text><text x="290" y="36" text-anchor="middle" font-size="12" fill="#993C1D">since 0.4.2</text>
<rect x="420" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text x="530" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Median of last 300 RMS</text><text x="530" y="36" text-anchor="middle" font-size="12" fill="#0F6E56">formal σ for N, E, U</text>
</g>

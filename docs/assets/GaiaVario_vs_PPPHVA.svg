<rect x="420" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/><text x="530" y="19" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Synthetic truth only</text><text x="530" y="36" text-anchor="middle" font-size="12" fill="#0F6E56">bridge adapter not done</text>
